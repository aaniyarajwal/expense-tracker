<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spendly | Edit Expense</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="container">

        <div class="modal edit-page">

            <div class="modal-header">

                <div>
                    <h2>Edit Expense</h2>
                    <p>Update your transaction details.</p>
                </div>

                <div class="modal-icon">
                    ✏️
                </div>

            </div>


            <form method="POST">

                <!-- Amount -->

                <div class="form-group">

                    <label>Amount</label>

                    <div class="input-box">

                        <span>₹</span>

                        <input
                            type="number"
                            name="amount"
                            value="{{ expense.amount }}"
                            step="0.01"
                            required
                        >

                    </div>
                    <div class="form-group">

    <label>Date</label>

    <input
        type="date"
        name="date"
        value="{{ expense.date }}"
        required
    >

</div>

                </div>


                <!-- Category -->

                <div class="form-group">

                    <label>Category</label>

                    <select name="category" required>

                        <option value="🍔 Food"
                            {% if expense.category == "🍔 Food" %}selected{% endif %}>
                            🍔 Food
                        </option>

                        <option value="🚗 Travel"
                            {% if expense.category == "🚗 Travel" %}selected{% endif %}>
                            🚗 Travel
                        </option>

                        <option value="🛍️ Shopping"
                            {% if expense.category == "🛍️ Shopping" %}selected{% endif %}>
                            🛍️ Shopping
                        </option>

                        <option value="🎮 Entertainment"
                            {% if expense.category == "🎮 Entertainment" %}selected{% endif %}>
                            🎮 Entertainment
                        </option>

                        <option value="📚 Education"
                            {% if expense.category == "📚 Education" %}selected{% endif %}>
                            📚 Education
                        </option>

                        <option value="💊 Health"
                            {% if expense.category == "💊 Health" %}selected{% endif %}>
                            💊 Health
                        </option>

                        <option value="💻 Technology"
                            {% if expense.category == "💻 Technology" %}selected{% endif %}>
                            💻 Technology
                        </option>

                        <option value="📦 Other"
                            {% if expense.category == "📦 Other" %}selected{% endif %}>
                            📦 Other
                        </option>

                    </select>

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label>Description</label>

                    <input
                        type="text"
                        name="description"
                        value="{{ expense.description }}"
                        required
                    >

                </div>


                <!-- Buttons -->

                <div class="edit-buttons">

                    <a href="/" class="cancel-btn">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="add-btn"
                    >
                        Save Changes →
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
